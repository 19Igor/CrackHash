server.port=8080
spring.jpa.generate-ddl=true
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=15672
spring.rabbitmq.virtual-host=/
spring.rabbitmq.username=user
spring.rabbitmq.password=user

spring.data.mongodb.database=MyFirstMongoDB
replicaSet=rs0
spring.data.mongodb.uri=mongodb://primary:27017,secondary1:27018,secondary2:27019/${spring.data.mongodb.database}?replicaSet=${replicaSet}